name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install development checks
        run: npm ci --ignore-scripts
      - name: Check modules and regression tests
        run: |
          npm run check
          npm test
      - name: Read immutable data release
        id: data
        run: |
          node -e 'const fs=require("fs"), d=require("./release-data.json"); if(!/^[a-f0-9]{40}$/.test(d.commit))throw Error("Invalid data commit"); fs.appendFileSync(process.env.GITHUB_OUTPUT,`repository=${d.repository}\ncommit=${d.commit}\n`);'
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.data.outputs.repository }}
          ref: ${{ steps.data.outputs.commit }}
          path: .release-data
          persist-credentials: false
      - name: Build and verify pinned static release
        run: |
          python3 scripts/build-phase-two-release.py --dataset .release-data --out _site
          python3 scripts/verify-phase-two-release.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
